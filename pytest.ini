[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --browser chromium
    --base-url https://www.saucedemo.com
    --tracing retain-on-failure
    --screenshot only-on-failure
markers =
    smoke: quick smoke tests
    login: tests for the login flow
    inventory: tests for the inventory page
